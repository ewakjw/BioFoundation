# @package _global_
# Copy of LuMamba_finetune.yaml adapted for Mumtaz2016 (healthy vs MDD).
# Place this file in: BioFoundation/config/experiment/
# Run with:  python -u run_train.py +experiment=LuMamba_finetune_mumtaz
#
# Paths use environment variables so the same file works on any machine:
#   DATA_PATH       -> folder that contains Mumtaz_MDD_bc_5s/{train,val,test}.h5
#   CHECKPOINT_DIR  -> output folder; weights are expected in CHECKPOINT_DIR/weights/

tag: LuMamba_finetune_mumtaz
model_size: tiny
gpus: 1
num_nodes: 1
num_workers: 4          # original: 32 (cluster setting)
batch_size: 64          # original: 512 (cluster setting)

training: True
final_validate: True
final_test: True
finetune_pretrained: True
resume: False

layerwise_lr_decay: 0.75
scheduler_type: cosine
classification_type: "bc"   # binary classification: healthy (0) vs MDD (1)

pretrained_checkpoint_path: null
# LeJEPA-only variant (JEPA-style pre-training only)
pretrained_safetensors_path: ${env:CHECKPOINT_DIR}/weights/LuMamba_LeJEPAOnly_128slices.safetensors

callbacks:
  progress_bar:
    _target_: 'pytorch_lightning.callbacks.TQDMProgressBar'
    refresh_rate: 50
  early_stopping:
    _target_: 'pytorch_lightning.callbacks.EarlyStopping'
    monitor: 'val_loss'
    patience: 15
    mode: 'min'
    verbose: True

input_normalization:
  normalize: True

finetuning:
  freeze_layers: False

io:
  checkpoint_dirpath: ${env:CHECKPOINT_DIR}/checkpoints
  version: ${tag}_${model_size}_finetune
  base_output_path: "${env:CHECKPOINT_DIR}/logs"

defaults:
  - override /data_module: finetune_data_module
  - override /model: LuMamba_tiny
  - override /scheduler: cosine
  - override /task: finetune_task_LUNA
  - override /criterion: finetune_criterion

data_module:
  train:
    _target_: 'datasets.mumtaz_dataset.Mumtaz_Dataset'
    hdf5_file: '${env:DATA_PATH}/Mumtaz_MDD_bc_5s/train.h5'
    finetune: True
  val:
    _target_: 'datasets.mumtaz_dataset.Mumtaz_Dataset'
    hdf5_file: '${env:DATA_PATH}/Mumtaz_MDD_bc_5s/val.h5'
    finetune: True
  test:
    _target_: 'datasets.mumtaz_dataset.Mumtaz_Dataset'
    hdf5_file: '${env:DATA_PATH}/Mumtaz_MDD_bc_5s/test.h5'
    finetune: True

model:
  num_classes: 2
  classification_type: ${classification_type}
  classifier_option: null   # null = default LUNA classifier head

trainer:
  enable_model_summary: True
  accelerator: gpu
  num_nodes: ${num_nodes}
  devices: ${gpus}
  strategy: auto            # original: ddp (not needed on a single GPU)
  max_epochs: 50
  precision: 32-true        # safe on any GPU; use bf16-mixed on RTX 3090/A100 for speed

model_checkpoint:
  save_last: True
  monitor: "val_loss"
  mode: "min"
  save_top_k: 1
  every_n_epochs: 1

optimizer:
  optim: 'AdamW'
  lr: 5.0e-4
  betas: [0.9, 0.999]
  weight_decay: 0.05